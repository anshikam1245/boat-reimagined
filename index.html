/* ==========================================================================
   Tokens: light ("day") and dark ("night") themes
   ========================================================================== */
:root{
  --r-xl:30px; --r-lg:22px; --r-md:14px; --r-sm:10px;
  --head-h:68px; --wrap:1320px; --gut:clamp(16px,4vw,40px); --bottom-pad:0px;
  --ease:cubic-bezier(.2,.7,.2,1);

  --bg:#FFFFFF; --bg-2:#F5F5F7; --surface:#FFFFFF; --surface-2:#F2F3F5; --surface-3:#E8E9ED;
  --line:#E3E4E8; --line-2:#CFD1D7;
  --text:#15161A; --text-2:#34363D; --mute:#5E6169;
  --inv:#15161A; --on-inv:#FFFFFF;
  --deal:#0A6B47; --red:#D7263D; --red-text:#B01C30; --red-wash:#FDEEF0; --focus:#3352E0;
  --head-bg:rgba(255,255,255,.84); --glass:rgba(255,255,255,.72); --glass-line:rgba(21,22,26,.08);
  --st-earbuds:#E3E9FF; --st-headphones:#F5EBD6; --st-neckbands:#DCF2E6; --st-watches:#ECE6FB; --st-speakers:#FFE5D8;
  --gl-earbuds:#5B7CFF; --gl-headphones:#E0A43A; --gl-neckbands:#2DBE83; --gl-watches:#8E63F5; --gl-speakers:#FF7A45;
  --aura-o:.22; --shadow:0 26px 60px -32px rgba(21,22,26,.38); --stage-edge:inset 0 0 0 1px rgba(21,22,26,.04);
  --band:#15161A; --on-band:#FFFFFF;
  color-scheme:light;
}
[data-theme="dark"]{
  --bg:#0B0C10; --bg-2:#101217; --surface:#14161C; --surface-2:#1B1E25; --surface-3:#262A34;
  --line:#23262F; --line-2:#363A45;
  --text:#F2F3F5; --text-2:#C8CBD2; --mute:#9EA2AB;
  --inv:#F2F3F5; --on-inv:#0B0C10;
  --deal:#4BE3A3; --red:#E5304A; --red-text:#FF7486; --red-wash:rgba(229,48,74,.14); --focus:#8FA6FF;
  --head-bg:rgba(11,12,16,.74); --glass:rgba(20,22,28,.72); --glass-line:rgba(255,255,255,.08);
  --st-earbuds:#D3DBF5; --st-headphones:#EADFC6; --st-neckbands:#CFE6D9; --st-watches:#DDD5F0; --st-speakers:#F0D7C8;
  --aura-o:.42; --shadow:0 30px 70px -28px rgba(0,0,0,.85); --stage-edge:inset 0 1px 0 rgba(255,255,255,.7);
  --band:#14161C; --on-band:#F2F3F5;
  color-scheme:dark;
}
.cat-earbuds{--st:var(--st-earbuds);--gl:var(--gl-earbuds)}
.cat-headphones{--st:var(--st-headphones);--gl:var(--gl-headphones)}
.cat-neckbands{--st:var(--st-neckbands);--gl:var(--gl-neckbands)}
.cat-watches{--st:var(--st-watches);--gl:var(--gl-watches)}
.cat-speakers{--st:var(--st-speakers);--gl:var(--gl-speakers)}

/* ---------- Base ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--head-h) + 16px);background:var(--bg)}
body{margin:0;font-family:"Archivo",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.55;font-weight:400;font-stretch:100%;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;transition:background-color .3s,color .3s}
h1,h2,h3,h4{margin:0;line-height:1.08;font-weight:760;letter-spacing:-.005em}
p{margin:0}
a{color:inherit}
img,svg{display:block;max-width:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
main:focus{outline:none}
::selection{background:var(--gl-earbuds);color:#fff}
.wrap{max-width:var(--wrap);margin-inline:auto;padding-inline:var(--gut)}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0;margin:-1px}
.skip{position:absolute;left:12px;top:-60px;z-index:100;background:var(--inv);color:var(--on-inv);padding:10px 14px;border-radius:10px;text-decoration:none}
.skip:focus{top:12px}
.num{font-variant-numeric:tabular-nums}
.display{font-stretch:125%;font-weight:820;line-height:.95;letter-spacing:-.014em}
.h-sec{font-size:clamp(1.55rem,1.1rem + 1.5vw,2.1rem);font-stretch:116%;font-weight:780}
.h-sub{font-size:1.35rem;font-stretch:110%;font-weight:750;margin-bottom:14px}
.muted{color:var(--mute)}
.link{font-weight:620;text-underline-offset:4px;text-decoration-thickness:1.5px;white-space:nowrap}
.link:hover{text-decoration-thickness:2.5px}

/* ---------- Buttons & chips ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 22px;border-radius:var(--r-md);border:1.5px solid var(--line-2);background:transparent;color:var(--text);font-weight:650;font-stretch:106%;font-size:15.5px;cursor:pointer;text-decoration:none;transition:background-color .15s,color .15s,border-color .15s,transform .1s;white-space:nowrap}
.btn:hover{background:var(--surface-2);border-color:var(--text)}
.btn.primary{background:var(--inv);color:var(--on-inv);border-color:var(--inv)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.btn.block{width:100%}
.btn.sm{min-height:40px;padding:0 16px;font-size:14.5px;border-radius:12px}
.chip{display:inline-flex;align-items:center;gap:8px;flex:none;height:40px;padding:0 15px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:14.5px;font-weight:580;cursor:pointer;color:var(--text);text-decoration:none;white-space:nowrap;transition:background-color .15s,border-color .15s,color .15s}
.chip:hover{border-color:var(--text)}
.chip[aria-pressed="true"]{background:var(--inv);border-color:var(--inv);color:var(--on-inv)}

/* ---------- Concept bar ---------- */
.concept{background:#000;color:#fff;font-size:13.5px;line-height:1.4;transition:background-color .2s}
[data-theme="light"] .concept{background:#15161A}
.concept .wrap{display:flex;gap:10px 18px;align-items:center;justify-content:space-between;min-height:40px;padding-block:8px;flex-wrap:wrap}
.concept a{color:#fff;font-weight:600;text-underline-offset:3px}
.concept .long{display:inline}
body.audit .concept{background:var(--red)}

/* ---------- Header ---------- */
.site-head{position:sticky;top:0;z-index:40;background:var(--head-bg);-webkit-backdrop-filter:saturate(1.5) blur(14px);backdrop-filter:saturate(1.5) blur(14px);border-bottom:1px solid var(--line)}
.site-head .wrap{display:flex;align-items:center;gap:14px;height:var(--head-h)}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--text);flex:none}
.wordmark{font-size:27px;font-weight:860;font-stretch:118%;letter-spacing:-.02em;line-height:1}
.logo .tag{font-size:11.5px;font-weight:650;border:1.5px solid currentColor;border-radius:999px;padding:1px 8px 2px;line-height:1.3}
.mainnav{display:flex;gap:2px}
.mainnav a{padding:8px 9px;border-radius:999px;text-decoration:none;font-weight:580;font-size:15px;white-space:nowrap;color:var(--text-2)}
.mainnav a:hover,.mainnav a[aria-current="page"]{background:var(--surface-2);color:var(--text)}
.search{position:relative;flex:1;max-width:400px;margin-left:auto}
.search input{width:100%;height:44px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface-2);padding:0 14px 0 40px;font:inherit;font-size:14.5px;font-weight:600;color:var(--text);-webkit-appearance:none;appearance:none;transition:border-color .15s,background-color .15s}
.search input::placeholder{color:var(--mute);font-weight:400;opacity:1}
.search input:focus{background:var(--surface);border-color:var(--text);outline:none}
.search .s-ico{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--mute);pointer-events:none}
.suggest{position:absolute;top:calc(100% + 8px);right:0;width:max(100%,400px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:8px;box-shadow:var(--shadow);z-index:50}
.suggest a.sg{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:6px 8px;border-radius:12px;text-decoration:none}
.suggest a.sg:hover,.suggest a.sg:focus-visible{background:var(--surface-2)}
.sg .thumb{width:48px;height:48px;border-radius:12px}
.sg b{font-weight:620;font-size:14.5px;display:block;line-height:1.2}
.sg small{color:var(--mute);font-size:12.5px}
.sg .p{font-weight:700;font-size:14px}
.suggest .all{display:block;padding:10px 8px 6px;font-weight:620;font-size:14px}
.suggest .none{padding:10px 8px;color:var(--mute);font-size:14px}
.head-actions{display:flex;gap:6px;align-items:center;flex:none}
.iconbtn{position:relative;display:inline-grid;place-items:center;width:44px;height:44px;border-radius:999px;border:0;background:transparent;color:var(--text);cursor:pointer;text-decoration:none;transition:background-color .15s}
.iconbtn:hover{background:var(--surface-2)}
.count{position:absolute;top:1px;right:-1px;min-width:20px;height:20px;border-radius:999px;background:var(--inv);color:var(--on-inv);font-size:11.5px;font-weight:700;display:grid;place-items:center;padding:0 5px;border:2px solid var(--bg)}
.count:empty{display:none}
.theme-btn .moon{display:none}
[data-theme="light"] .theme-btn .sun{display:none}
[data-theme="light"] .theme-btn .moon{display:block}
.audit-btn{display:inline-flex;align-items:center;gap:9px;height:40px;padding:0 12px 0 11px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);font-size:14px;font-weight:650;cursor:pointer;white-space:nowrap}
.audit-btn .sw{width:30px;height:18px;border-radius:999px;background:var(--surface-3);position:relative;transition:background-color .2s;flex:none}
.audit-btn .sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .2s var(--ease)}
.audit-btn[aria-pressed="true"]{border-color:var(--red);color:var(--red-text)}
.audit-btn[aria-pressed="true"] .sw{background:var(--red)}
.audit-btn[aria-pressed="true"] .sw::after{transform:translateX(12px)}
.m-only{display:none}
.lbl-short{display:none}

/* ---------- Stages: lit shelves for the product photos ---------- */
.stage,.hero-stage,.g-stage,.thumb,.li-stage,.sw-btn,.vthumb,.cat-tile .shelf,.bento .shelf{background:radial-gradient(120% 85% at 50% 6%,rgba(255,255,255,.78),rgba(255,255,255,0) 60%),var(--st,var(--surface-2));isolation:isolate}
.stage>img,.hero-stage img,.g-stage>img,.thumb>img,.li-stage>img,.sw-btn>img,.shelf>img{mix-blend-mode:multiply;object-fit:contain}
.thumb,.li-stage{display:grid;place-items:center;overflow:hidden}
.thumb>img,.thumb>svg,.li-stage>img,.li-stage>svg{width:88%;height:88%}

/* ---------- Home: hero ---------- */
.hero{position:relative;overflow:hidden;padding-block:clamp(28px,5vw,64px) clamp(28px,4vw,44px)}
.aura{position:absolute;width:min(70vw,900px);aspect-ratio:1/1;border-radius:50%;right:-12%;top:-28%;background:var(--gl);opacity:var(--aura-o);filter:blur(110px);transition:background-color .7s var(--ease);pointer-events:none;z-index:0}
.aura.two{left:-18%;right:auto;top:auto;bottom:-55%;width:min(55vw,700px);background:var(--gl-watches);opacity:calc(var(--aura-o) * .55)}
.hero-grid{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:clamp(28px,4vw,72px);align-items:center}
.hero h1{font-size:clamp(2.5rem,4.15vw,4.9rem)}
.hero h1.swell{animation:swell 1s var(--ease) both}
@keyframes swell{from{font-stretch:72%;font-weight:480;opacity:0}to{font-stretch:125%;font-weight:820;opacity:1}}
.lede{font-size:clamp(1.05rem,1rem + .3vw,1.2rem);color:var(--mute);max-width:52ch;margin:20px 0 26px}
.moods{display:flex;flex-wrap:wrap;gap:10px}
.mood{display:inline-flex;align-items:center;gap:10px;height:52px;padding:0 18px 0 21px;border-radius:999px;border:1px solid var(--line-2);background:var(--glass);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font-size:17px;font-weight:640;font-stretch:104%;cursor:pointer;color:var(--text);transition:background-color .2s,color .2s,font-stretch .3s var(--ease),border-color .2s}
.mood .n{font-size:13px;font-weight:620;color:var(--mute);font-stretch:100%}
.mood:hover{border-color:var(--text)}
.mood[aria-pressed="true"]{background:var(--inv);color:var(--on-inv);border-color:var(--inv);font-stretch:118%}
.mood[aria-pressed="true"] .n{color:inherit;opacity:.65}
.hero-note{margin-top:22px;font-size:13.5px;color:var(--mute)}
.hero-stage{position:relative;aspect-ratio:1/1;border-radius:40px;overflow:hidden;box-shadow:var(--shadow),var(--stage-edge);transition:background-color .6s var(--ease)}
.hero-stage .pic{position:absolute;inset:6% 9% 22%;display:grid;place-items:center}
.hero-stage .pic img,.hero-stage .pic svg{width:100%;height:100%;transition:opacity .32s var(--ease),transform .55s var(--ease)}
.hero-stage .pic.out img,.hero-stage .pic.out svg{opacity:0;transform:scale(.93) translateY(8px)}
.hero-pick{position:absolute;left:16px;right:16px;bottom:16px;display:flex;align-items:center;gap:14px;justify-content:space-between;background:rgba(11,12,16,.8);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:#fff;border-radius:22px;padding:12px 12px 12px 18px;text-decoration:none}
.hero-pick small{display:block;font-size:12.5px;color:rgba(255,255,255,.66);font-weight:560}
.hero-pick b{display:block;font-size:17px;font-weight:720;font-stretch:108%;line-height:1.2}
.hero-pick .pp{font-size:14px;color:rgba(255,255,255,.82)}
.hero-pick .go{flex:none;background:#fff;color:#0B0C10;border-radius:14px;padding:10px 14px;font-weight:680;font-size:14.5px}
.mood-out{position:relative;z-index:1;margin-top:clamp(28px,4vw,48px)}
.mood-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.mood-head p{color:var(--text-2)}

/* ---------- Sections, rails, grids ---------- */
.sec{padding-block:clamp(32px,4.5vw,64px)}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.sec-head p{margin-top:6px;color:var(--mute)}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 60px) / 4);gap:28px 20px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 0 12px;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:34px 20px}

/* ---------- Product card ---------- */
.card{position:relative;display:flex;flex-direction:column;scroll-snap-align:start;min-width:0}
.card .cl{color:inherit;text-decoration:none;display:flex;flex-direction:column;gap:5px}
.stage{position:relative;aspect-ratio:1/1;border-radius:var(--r-lg);display:grid;place-items:center;overflow:hidden;box-shadow:var(--stage-edge);transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.stage>img,.stage>svg{width:84%;height:84%;transition:transform .45s var(--ease)}
.card .cl:hover .stage{transform:translateY(-4px);box-shadow:0 24px 50px -26px color-mix(in srgb,var(--gl) 75%,transparent),var(--stage-edge)}
.card .cl:hover .stage>img,.card .cl:hover .stage>svg{transform:scale(1.05)}
.badge{position:absolute;top:12px;left:12px;font-size:12px;font-weight:650;background:rgba(11,12,16,.78);color:#fff;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:999px;padding:4px 10px;line-height:1.3;z-index:1}
.badge.soon{background:rgba(255,255,255,.9);color:#15161A}
.add{position:absolute;right:10px;top:10px;width:40px;height:40px;border-radius:999px;border:0;background:rgba(255,255,255,.92);color:#15161A;display:grid;place-items:center;cursor:pointer;z-index:2;transition:background-color .15s,color .15s,transform .15s}
.add:hover{background:#15161A;color:#fff;transform:scale(1.06)}
.add[disabled]{display:none}
.pname{font-size:17px;font-weight:680;font-stretch:106%;margin-top:12px;line-height:1.2}
.feat{font-size:14px;color:var(--mute);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rate{display:flex;align-items:center;gap:5px;font-size:13.5px;font-weight:640}
.rate span{color:var(--mute);font-weight:500}
.price{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 8px;font-variant-numeric:tabular-nums}
.price b{font-size:18px;font-weight:780;font-stretch:108%}
.price s{color:var(--mute);font-size:14px}
.price .off{font-size:13.5px;font-weight:660;color:var(--deal)}
.yp{font-size:13px;color:var(--text-2);font-weight:560}

/* ---------- Category tiles ---------- */
.cats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}
.cat-tile{display:flex;flex-direction:column;border-radius:var(--r-xl);text-decoration:none;color:var(--text);position:relative;transition:transform .35s var(--ease)}
.cat-tile .shelf{aspect-ratio:4/5;border-radius:var(--r-xl);display:grid;place-items:center;overflow:hidden;box-shadow:var(--stage-edge);transition:box-shadow .35s var(--ease)}
.cat-tile .shelf>img,.cat-tile .shelf>svg{width:86%;height:86%;transition:transform .45s var(--ease)}
.cat-tile:hover .shelf{box-shadow:0 26px 60px -28px color-mix(in srgb,var(--gl) 80%,transparent),var(--stage-edge)}
.cat-tile:hover .shelf>img,.cat-tile:hover .shelf>svg{transform:scale(1.06) rotate(-2deg)}
.cat-tile .tcap{display:grid;gap:2px;padding:14px 4px 0}
.cat-tile h3{font-size:clamp(1.15rem,.95rem + .5vw,1.35rem);font-stretch:116%;font-weight:800}
.cat-tile p{font-size:13.5px;color:var(--mute);white-space:nowrap}

/* ---------- Tech bento ---------- */
.bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,minmax(230px,auto));gap:16px}
.bento a{position:relative;display:flex;flex-direction:column;gap:10px;border-radius:var(--r-xl);background:var(--surface);border:1px solid var(--line);padding:22px;text-decoration:none;color:var(--text);overflow:hidden;transition:border-color .2s,transform .3s var(--ease)}
.bento a:hover{border-color:var(--line-2);transform:translateY(-3px)}
.bento a::before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;right:-80px;bottom:-110px;background:var(--gl);opacity:calc(var(--aura-o) * .6);filter:blur(60px);pointer-events:none}
.bento .big{grid-column:span 2;grid-row:span 2;padding:28px}
.bento h3{font-size:1.3rem;font-stretch:114%;font-weight:780}
.bento .big h3{font-size:clamp(1.8rem,1.3rem + 1.4vw,2.6rem);font-stretch:122%}
.bento p{color:var(--text-2);font-size:15px;max-width:40ch;position:relative}
.bento .go{margin-top:auto;font-weight:650;font-size:14.5px;position:relative;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1.5px}
.bento .shelf{width:96px;height:96px;border-radius:20px;display:grid;place-items:center;overflow:hidden;align-self:flex-end;margin-top:-6px;box-shadow:var(--stage-edge)}
.bento .shelf>img,.bento .shelf>svg{width:88%;height:88%}
.bento .big .shelf{width:auto;height:auto;flex:1;min-height:220px;align-self:stretch;margin:6px 0 4px;border-radius:24px}
.bento .big .shelf>img,.bento .big .shelf>svg{width:70%;height:auto;max-height:300px}

/* ---------- Audit band ---------- */
.band{border-radius:var(--r-xl);background:var(--band);color:var(--on-band);padding:clamp(26px,4vw,52px);display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px clamp(28px,4vw,64px);align-items:center;position:relative;overflow:hidden;border:1px solid var(--line)}
.band::before{content:"";position:absolute;width:520px;height:520px;border-radius:50%;left:-200px;top:-260px;background:var(--red);opacity:.22;filter:blur(110px);pointer-events:none}
.band>*{position:relative}
.band h2{font-size:clamp(1.9rem,1.2rem + 2.3vw,3.1rem);font-stretch:122%;font-weight:830;line-height:1}
.band p{color:color-mix(in srgb,var(--on-band) 78%,transparent);max-width:50ch;margin-top:16px}
.band .acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.band .btn{border-color:color-mix(in srgb,var(--on-band) 45%,transparent);color:var(--on-band)}
.band .btn:hover{background:rgba(255,255,255,.08)}
.band .btn.primary{background:var(--on-band);color:var(--band);border-color:var(--on-band)}
.pen{display:flex;gap:6px;margin-bottom:18px}
.pen span{font-size:12.5px;font-weight:780;font-stretch:112%;padding:6px 9px;border-radius:999px;background:var(--red);color:#fff}
.faqcard{background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--r-lg);padding:18px;display:grid;gap:10px;color:var(--text)}
.faqcard .lab{font-size:13px;color:var(--mute);font-weight:600}
.faqcard .row{border-radius:14px;padding:12px 14px;display:grid;gap:4px}
.faqcard .bad{background:var(--red-wash)}
.faqcard .bad s{text-decoration-color:var(--red);text-decoration-thickness:2px;font-weight:600}
.faqcard .bad small{color:var(--red-text);font-weight:650;font-size:12.5px}
.faqcard .good{background:color-mix(in srgb,var(--deal) 14%,transparent)}
.faqcard .good b{font-weight:680}
.faqcard .good small{color:var(--deal);font-weight:650;font-size:12.5px}
[data-theme="light"] .band{border-color:transparent}
[data-theme="light"] .faqcard{background:#1E2027;border-color:#2C2F38;color:#F2F3F5}
[data-theme="light"] .faqcard .lab{color:#A3A7B0}
[data-theme="light"] .faqcard .bad{background:rgba(229,48,74,.16)}
[data-theme="light"] .faqcard .bad small{color:#FF8B9A}
[data-theme="light"] .faqcard .good{background:rgba(75,227,163,.14)}
[data-theme="light"] .faqcard .good small{color:#4BE3A3}

/* ---------- Gift band ---------- */
.gift-band{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:24px;border-radius:var(--r-xl);padding:clamp(24px,4vw,46px);background:linear-gradient(110deg,var(--st-headphones) 0%,var(--st-speakers) 55%,var(--st-watches) 100%);text-decoration:none;color:#15161A;position:relative;overflow:hidden}
.gift-band h2{font-size:clamp(1.7rem,1.2rem + 2vw,2.8rem);font-stretch:122%;font-weight:830;line-height:1}
.gift-band p{margin-top:10px;color:#34363D}
.gift-band .btn{background:#15161A;color:#fff;border-color:#15161A}

/* ---------- Promises ---------- */
.promises{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-block:clamp(24px,4vw,48px)}
.promises div{padding:20px 20px;border-radius:var(--r-lg);background:var(--surface-2);display:grid;gap:2px}
.promises svg{color:var(--deal);margin-bottom:8px}
.promises b{font-weight:700;font-stretch:106%}
.promises span{font-size:14px;color:var(--mute)}

/* ---------- Listing page ---------- */
.plp-head{padding-block:28px 14px;position:relative}
.crumbs{font-size:14px;color:var(--mute);padding-top:18px}
.crumbs a{color:inherit;text-underline-offset:3px}
.plp-head h1{font-size:clamp(2.2rem,1.4rem + 3vw,4.2rem);font-stretch:125%;font-weight:830;margin-top:8px;line-height:.98}
.plp-head p{margin-top:10px;color:var(--mute)}
.filters{position:sticky;top:var(--head-h);z-index:20;background:var(--head-bg);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:12px 0;border-bottom:1px solid var(--line);margin-bottom:26px}
.filters .row{display:flex;gap:8px;align-items:center;overflow-x:auto;scrollbar-width:none}
.filters .row::-webkit-scrollbar{display:none}
.filters .sep{width:1px;height:26px;background:var(--line-2);flex:none;margin-inline:4px}
.sort{margin-left:auto;flex:none;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mute)}
.sort select{height:40px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);padding:0 34px 0 14px;font:inherit;font-size:14.5px;font-weight:600;color:var(--text);-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;cursor:pointer}
.result-n{font-size:14px;color:var(--mute);margin-bottom:16px}
.empty{padding:40px 0 56px}
.empty h2{font-size:1.4rem;font-stretch:110%}
.empty p{color:var(--mute);margin:8px 0 18px;max-width:52ch}

/* ---------- Product page ---------- */
.pdp{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(24px,4vw,64px);padding-block:18px 48px;align-items:start}
.gallery{position:sticky;top:calc(var(--head-h) + 18px)}
.gallery .aura{right:auto;left:10%;top:6%;width:80%;opacity:calc(var(--aura-o) * .9);filter:blur(90px)}
.g-stage{border-radius:36px;aspect-ratio:1/1;display:grid;place-items:center;position:relative;overflow:hidden;box-shadow:var(--shadow),var(--stage-edge);z-index:1}
.g-stage>img,.g-stage>svg{width:78%;height:78%;transition:transform .5s var(--ease)}
.g-stage.zoomed>img,.g-stage.zoomed>svg{transform:scale(1.75)}
.g-fail{position:absolute;left:16px;right:16px;bottom:16px;background:rgba(11,12,16,.82);color:#fff;border-radius:14px;padding:10px 14px;font-size:13.5px;font-weight:560;z-index:2}
.g-tools{display:flex;gap:10px;margin-top:14px;align-items:center;flex-wrap:wrap;position:relative;z-index:1}
.g-tools .grp{display:flex;gap:10px}
.vthumb{width:68px;height:68px;border-radius:16px;border:2px solid transparent;padding:0;cursor:pointer;overflow:hidden;display:grid;place-items:center;transition:border-color .15s}
.vthumb>img,.vthumb>svg{width:90%;height:90%;mix-blend-mode:multiply;object-fit:contain}
.vthumb.zoom>img,.vthumb.zoom>svg{transform:scale(1.8)}
.vthumb[aria-pressed="true"]{border-color:var(--text)}
.g-tools .chip.sim{margin-left:auto}
.g-note{font-size:13px;color:var(--mute);margin-top:12px;position:relative;z-index:1}
.buy h1{font-size:clamp(2.2rem,1.5rem + 2.4vw,3.4rem);font-stretch:118%;font-weight:830;line-height:.98}
.buy .sub{color:var(--mute);margin:12px 0 12px;font-size:16px}
.rate-btn{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:4px 0;font-size:14.5px;font-weight:640;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-2);color:var(--text)}
.rate-btn span{color:var(--mute);font-weight:500}
.pricebox{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-lg);padding:20px 22px 16px;margin:18px 0;position:relative}
.pb-top{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px;font-variant-numeric:tabular-nums}
.pb-top .now{font-size:38px;font-weight:830;font-stretch:112%;line-height:1}
.pb-top s{color:var(--mute);font-size:17px}
.pb-top .off{color:var(--deal);font-weight:700}
.pb-tax{font-size:13px;color:var(--mute);margin-top:6px}
.pb-yours{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line-2);display:grid;gap:2px}
.pb-yours b{font-size:17px;font-weight:740;font-stretch:106%}
.pb-yours span{font-size:14px;color:var(--text-2)}
.pb-bulk{margin-top:10px;font-size:14px}
.pb-bulk summary{cursor:pointer;font-weight:620;list-style:none;display:inline-flex;align-items:center;gap:6px;padding:4px 0}
.pb-bulk summary::-webkit-details-marker{display:none}
.pb-bulk summary::after{content:"";width:7px;height:7px;border-right:2px solid;border-bottom:2px solid;transform:translateY(-2px) rotate(45deg);transition:transform .2s}
.pb-bulk[open] summary::after{transform:translateY(1px) rotate(-135deg)}
.pb-bulk p{color:var(--text-2);margin-top:6px}
.swatch-wrap{margin:4px 0 18px;position:relative}
.swatch-wrap .lab{font-size:14px;color:var(--mute);margin-bottom:8px}
.swatch-wrap .lab b{color:var(--text);font-weight:640}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw-btn{width:68px;height:68px;border-radius:16px;border:2px solid transparent;padding:0;cursor:pointer;display:grid;place-items:center;overflow:hidden;transition:border-color .15s}
.sw-btn>img,.sw-btn>svg{width:90%;height:90%}
.sw-btn[aria-pressed="true"]{border-color:var(--text)}
.buyrow{display:flex;gap:12px;align-items:stretch;position:relative}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:var(--r-md);height:56px;flex:none;background:var(--surface)}
.qty button{width:46px;height:100%;border:0;background:none;font-size:20px;cursor:pointer;display:grid;place-items:center;border-radius:var(--r-md);color:var(--text)}
.qty button:hover{background:var(--surface-2)}
.qty output{min-width:26px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.buyrow .btn{flex:1;min-height:56px;font-size:16.5px}
.soon-note{margin-top:10px;font-size:14px;color:var(--mute)}
.promise-mini{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px;margin-top:22px;font-size:14px;color:var(--text-2)}
.promise-mini div{display:flex;gap:8px;align-items:flex-start}
.promise-mini svg{flex:none;margin-top:2px;color:var(--deal)}
.details{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,4vw,60px);padding-block:36px;border-top:1px solid var(--line)}
.details>section{position:relative}
.spec{width:100%;border-collapse:collapse;font-size:15px}
.spec th{text-align:left;font-weight:520;color:var(--mute);padding:12px 14px 12px 0;width:44%;vertical-align:top;border-bottom:1px solid var(--line)}
.spec td{padding:12px 0;border-bottom:1px solid var(--line);font-weight:580}
.legal-d{margin-top:16px;font-size:14px}
.legal-d summary{cursor:pointer;font-weight:620;padding:6px 0}
.legal-d p{color:var(--text-2);margin-top:4px}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;padding:16px 34px 16px 0;font-weight:620;position:relative}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"";position:absolute;right:8px;top:50%;width:9px;height:9px;border-right:2px solid;border-bottom:2px solid;transform:translateY(-70%) rotate(45deg);transition:transform .2s}
.faq details[open] summary::after{transform:translateY(-25%) rotate(-135deg)}
.faq .a{padding:0 0 16px;color:var(--text-2)}
.faq .src{display:inline-block;margin-top:8px;font-size:12.5px;font-weight:620;color:var(--text-2);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.lint{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:13.5px;color:var(--mute)}
.lint svg{flex:none;color:var(--deal);margin-top:1px}
.reviews{position:relative}
.r-sum{display:flex;align-items:center;gap:16px;margin-bottom:10px}
.r-big{font-size:54px;font-weight:830;font-stretch:114%;line-height:1}
.stars{display:flex;gap:2px;color:var(--text)}
.r-sum p{font-size:14px;color:var(--mute);margin-top:4px}
.compare{overflow-x:auto}
.compare table{border-collapse:collapse;width:100%;min-width:540px;font-size:14.5px}
.compare th,.compare td{padding:12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.compare thead th{font-weight:680;font-stretch:104%;vertical-align:bottom}
.compare thead .thumb{width:64px;height:64px;border-radius:14px;margin-bottom:8px}
.compare thead a{text-decoration:none}
.compare thead a:hover{text-decoration:underline}
.compare tbody th{font-weight:520;color:var(--mute);width:150px}
.compare .this{background:var(--surface-2)}
.compare .nl{color:var(--mute);font-weight:400}

/* ---------- Gifting / checkout / audit pages ---------- */
.page-hero{padding-block:clamp(36px,6vw,72px) clamp(16px,2vw,28px);position:relative;overflow:hidden}
.page-hero h1{font-size:clamp(2.6rem,1.3rem + 5.4vw,6.2rem);max-width:12ch;position:relative}
.page-hero>:not(.aura){position:relative}
/* Full-bleed glow that fades out inside the section, so no clipped edges show */
.page-hero .aura{position:absolute;top:-55%;right:-10%;width:min(80vw,1150px);height:150%;aspect-ratio:auto;filter:none;background:radial-gradient(closest-side,var(--gl),color-mix(in srgb,var(--gl) 42%,transparent) 48%,transparent);opacity:calc(var(--aura-o) * .95)}
.note-card{border-radius:var(--r-lg);background:var(--surface-2);border:1px solid var(--line);padding:22px 24px;display:grid;gap:6px;position:relative}
.note-card b{font-size:17px;font-weight:720}
.note-card span{color:var(--text-2)}
a.note-card{text-decoration:none;color:inherit;transition:border-color .2s}
a.note-card:hover{border-color:var(--line-2)}
.co{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(24px,4vw,56px);padding-block:28px 56px;align-items:start}
.stop{border-radius:var(--r-xl);background:var(--band);color:var(--on-band);padding:clamp(24px,3vw,38px);position:relative;overflow:hidden;border:1px solid var(--line)}
.stop::before{content:"";position:absolute;width:360px;height:360px;border-radius:50%;right:-140px;top:-160px;background:var(--gl-earbuds);opacity:.25;filter:blur(90px);pointer-events:none}
.stop>*{position:relative}
.stop h2{font-size:clamp(1.6rem,1.2rem + 1.4vw,2.3rem);font-stretch:120%;font-weight:830}
.stop p{color:color-mix(in srgb,var(--on-band) 80%,transparent);margin-top:12px}
.stop .acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.stop .btn{border-color:color-mix(in srgb,var(--on-band) 45%,transparent);color:var(--on-band)}
.stop .btn.primary{background:var(--on-band);color:var(--band);border-color:var(--on-band)}
.signin{margin-top:18px;border:1.5px dashed color-mix(in srgb,var(--on-band) 35%,transparent);border-radius:var(--r-md);padding:14px 16px;font-size:14.5px;position:relative}
.signin b{display:block}
.fix-group{margin-top:34px}
.fix-group h2{font-size:1.15rem;font-stretch:108%;font-weight:720;padding-bottom:10px;border-bottom:1.5px solid var(--text)}
.fx{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:6px 18px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.fx h3{font-size:17px;font-weight:680;font-stretch:104%;line-height:1.25}
.fx p{font-size:14px;color:var(--mute);margin-top:2px}
.fx .fid{justify-self:start}
.two-up{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;margin-top:20px}
.plain-list{list-style:none;padding:0;margin:0}
.plain-list li{padding:12px 0;border-bottom:1px solid var(--line)}
.plain-list b{font-weight:680}
.plain-list b+span{display:block;color:var(--mute);font-size:14.5px;margin-top:2px}
.shop-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

/* ---------- Search page ---------- */
.search-page{padding-block:24px 8px}
.search.big{max-width:none;margin:0}
.search.big input{height:58px;font-size:18px;padding-left:52px}
.search.big .s-ico{left:18px}
.tries{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}

/* ---------- Cart drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;opacity:0;transition:opacity .2s;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.scrim.show{opacity:1}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--surface);color:var(--text);z-index:70;transform:translateX(102%);transition:transform .3s var(--ease);display:flex;flex-direction:column;visibility:hidden;border-left:1px solid var(--line)}
.drawer.open{transform:none;visibility:visible}
.dr-head{display:flex;align-items:center;gap:10px;padding:16px 16px 16px 22px;border-bottom:1px solid var(--line);position:relative}
.dr-head h2{font-size:1.4rem;font-stretch:114%}
.dr-head .n{color:var(--mute);font-size:14px;margin-right:auto}
.dr-body{flex:1;overflow:auto;padding:4px 22px}
.dr-foot{border-top:1px solid var(--line);padding:14px 22px calc(16px + env(safe-area-inset-bottom))}
.line-item{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center}
.li-stage{width:72px;height:72px;border-radius:16px}
.li-name{font-weight:650;line-height:1.25;text-decoration:none}
.li-name:hover{text-decoration:underline}
.li-meta{font-size:13.5px;color:var(--mute)}
.li-qty{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:10px;margin-top:6px;height:34px}
.li-qty button{width:32px;height:100%;border:0;background:none;cursor:pointer;font-size:17px;border-radius:10px;color:var(--text)}
.li-qty button:hover{background:var(--surface-2)}
.li-qty output{min-width:22px;text-align:center;font-weight:700;font-size:14px}
.li-right{text-align:right;display:grid;gap:4px;justify-items:end}
.li-right b{font-variant-numeric:tabular-nums}
.li-del{border:0;background:none;color:var(--mute);font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:2px;padding:0}
.offer{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:13px 15px;font-size:14px;margin-bottom:12px;position:relative}
.offer b{display:block;font-weight:700;font-size:14.5px}
.offer>span{color:var(--text-2)}
.offer details{margin-top:6px}
.offer summary{cursor:pointer;color:var(--text-2);font-weight:600}
.offer ul{margin:6px 0 0;padding-left:18px;color:var(--text-2)}
.totals{display:grid;gap:5px;font-size:15px;margin-bottom:14px;font-variant-numeric:tabular-nums}
.totals div{display:flex;justify-content:space-between;gap:12px}
.totals .save{color:var(--deal)}
.totals .grand{font-size:21px;font-weight:820;font-stretch:108%;padding-top:6px;border-top:1px solid var(--line);margin-top:4px}
.fine{font-size:12.5px;color:var(--mute);margin-top:10px;text-align:center}
.cart-empty{padding:40px 0}
.cart-empty p{color:var(--mute);margin:6px 0 16px}

/* ---------- Footer (D7) ---------- */
.foot{background:var(--bg-2);border-top:1px solid var(--line);margin-top:48px;padding-block:44px calc(32px + var(--bottom-pad))}
.foot-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:24px 48px;position:relative}
.foot h2{font-size:1.05rem;font-weight:720;margin-bottom:12px}
.foot-pop{display:flex;flex-wrap:wrap;gap:8px}
.foot details{border-top:1px solid var(--line-2)}
.foot details:last-of-type{border-bottom:1px solid var(--line-2)}
.foot summary{padding:13px 0;font-weight:640;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:12px}
.foot summary::-webkit-details-marker{display:none}
.foot summary span{color:var(--mute);font-weight:500;font-size:14px}
.foot details ul{list-style:none;padding:0 0 14px;margin:0;columns:3;column-gap:24px}
.foot details li a{color:var(--text-2);font-size:14px;line-height:2.1;text-decoration:none}
.foot details li a:hover{text-decoration:underline}
.legal{margin-top:30px;padding-top:20px;border-top:1px solid var(--line-2);font-size:13px;color:var(--mute);display:grid;gap:6px;max-width:90ch}
.legal a{color:var(--text-2)}

/* ---------- Mobile tab bar + buy bar (M1) ---------- */
.tabbar{display:none}
.buybar{display:none}

/* ---------- Toast ---------- */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);opacity:0;pointer-events:none;background:var(--inv);color:var(--on-inv);border-radius:16px;padding:10px 10px 10px 18px;display:flex;gap:14px;align-items:center;z-index:90;transition:opacity .22s var(--ease),transform .22s var(--ease);font-size:14.5px;max-width:calc(100vw - 32px);box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:var(--on-inv);color:var(--inv);border:0;border-radius:10px;padding:8px 12px;font-weight:650;cursor:pointer;white-space:nowrap}

/* ---------- Audit view: the red pen ---------- */
body.audit [data-fix]{outline:2px dashed var(--red);outline-offset:3px}
body.audit [data-kept]{outline:2px dotted var(--text);outline-offset:3px}
.pin-host{position:relative}
.pins{position:absolute;top:10px;right:10px;z-index:35;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px;pointer-events:none}
.pins.out{top:-13px;right:8px}
.pin{pointer-events:auto;font-size:12.5px;font-weight:780;font-stretch:112%;line-height:1;padding:7px 9px;border-radius:999px;border:2px solid var(--bg);background:var(--red);color:#fff;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.pin:hover{filter:brightness(1.1)}
.pin.kept{background:var(--surface);color:var(--text);border-color:var(--text)}
.flash{animation:flash 1.4s ease}
@keyframes flash{0%,100%{box-shadow:0 0 0 0 rgba(229,48,74,0)}25%,60%{box-shadow:0 0 0 10px rgba(229,48,74,.28)}}
.fid{display:inline-block;background:var(--red);color:#fff;font-weight:800;font-stretch:112%;border-radius:8px;padding:3px 8px;font-size:14px;line-height:1.3}
.fid.kept{background:transparent;color:var(--text);border:1.5px solid var(--text)}
.sev{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:660;border:1.5px solid;line-height:1.4;white-space:nowrap}
.sev.critical{background:var(--red);border-color:var(--red);color:#fff}
.sev.major{border-color:var(--red);color:var(--red-text)}
.sev.minor{border-color:var(--text);color:var(--text)}
.sev.cosmetic{border-color:var(--line-2);color:var(--mute)}
.ap{position:fixed;top:0;right:0;bottom:0;width:min(420px,100vw);z-index:80;background:var(--surface);color:var(--text);border-left:4px solid var(--red);transform:translateX(104%);transition:transform .3s var(--ease);display:flex;flex-direction:column;box-shadow:-30px 0 70px -40px rgba(0,0,0,.6);visibility:hidden}
.ap.open{transform:none;visibility:visible}
@media (min-width:1100px){body{transition:padding-right .3s var(--ease),background-color .3s,color .3s} body.ap-open{padding-right:420px} body.ap-open .mainnav{display:none} body.ap-open .toast{margin-left:-210px}}
.ap-head{display:flex;align-items:center;gap:8px;padding:12px 10px 12px 20px;border-bottom:1px solid var(--line)}
.ap-head .iconbtn{margin-left:auto}
.ap-body{flex:1;overflow:auto;padding:18px 22px 28px}
.ap-body h2{font-size:24px;font-stretch:112%;font-weight:790;line-height:1.12}
.ap-body h2:focus{outline:none}
.ap-body .where{color:var(--mute);font-size:14px;margin:6px 0 4px}
.ap-body h3{font-size:14.5px;font-weight:740;margin:18px 0 5px}
.ap-body h3.was{color:var(--red-text)}
.ap-body h3.now{color:var(--deal)}
.ap-body p{font-size:15px;line-height:1.55}
.ap-body .why{background:var(--red-wash);border-radius:12px;padding:12px 14px;margin-top:14px;font-size:14.5px}
.ap-body .principle{margin-top:14px;font-size:13.5px;color:var(--mute)}
.ap-body .demo{margin-top:14px;display:grid;gap:8px;justify-items:start}
.ap-body .demo p{font-size:13.5px;color:var(--mute)}
.wrong{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:6px}
.wrong li{padding:9px 12px;border-radius:10px;background:var(--red-wash);font-size:14px}
.wrong s{text-decoration-color:var(--red);text-decoration-thickness:1.5px}
.wrong em{font-style:normal;font-weight:680;color:var(--red-text);display:block;font-size:12.5px;margin-top:2px}
.cap{font-size:12.5px;color:var(--mute);margin-top:6px}
.ap-onpage{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line);font-size:13.5px;color:var(--mute)}
.ap-onpage span{margin-right:4px}
.jump{font-size:12.5px;font-weight:760;font-stretch:112%;padding:5px 9px;border-radius:999px;border:1.5px solid var(--red);background:transparent;color:var(--red-text);cursor:pointer}
.jump:hover{background:var(--red-wash)}
.ap-links{display:flex;flex-wrap:wrap;gap:10px 18px;margin-top:16px;font-size:14.5px}

/* ---------- Responsive ---------- */
@media (max-width:1180px){
  .mainnav a{padding:8px 7px;font-size:14.5px}
  .search{max-width:280px}
  .bento{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bento .big{grid-row:span 1}
}
@media (max-width:1023px){
  .mainnav{display:none}
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .rail{grid-auto-columns:calc((100% - 40px) / 3)}
  .cats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .band,.foot-top,.co,.hero-grid{grid-template-columns:1fr}
  .hero-stage{max-width:560px;width:100%;justify-self:center}
  .search{max-width:none}
  .promises{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (min-width:768px) and (max-width:1023px){
  :root{--head-h:108px}
  .site-head .wrap{flex-wrap:wrap;height:auto;min-height:var(--head-h);padding-block:10px 4px;row-gap:2px;align-content:center}
  .mainnav{display:flex;order:5;flex-basis:100%;overflow-x:auto;scrollbar-width:none;margin-left:-9px}
  .mainnav::-webkit-scrollbar{display:none}
}
@media (max-width:767px){
  :root{--head-h:60px;--bottom-pad:68px}
  .concept .long{display:none}
  .search.in-head{display:none}
  .m-only{display:inline-grid}
  .audit-btn{height:36px;padding:0 10px 0 9px;font-size:13px;gap:7px}
  .audit-btn .lbl-long{display:none}
  .audit-btn .lbl-short{display:inline}

function decorate() {

function demoFor(id) {
  const pdp = currentView && currentView.name === "pdp";
  if (id === "D4" && pdp) return `<div class="demo"><button class="btn sm" type="button" data-break>Break the product photo</button><p>Swaps in a photo that can’t load, so you can watch the fallback take over.</p></div>`;
  if (id === "D6" && pdp && !byId[currentView.pid].stock) return `<div class="demo"><button class="btn sm" type="button" data-demo-bulk>Add 2 and open the cart</button><p>Watch the cart compare the offers and pick the best one.</p></div>`;
  if (id === "M1" && !isMobile()) return `<div class="demo"><p>On a desktop? Narrow the window below 768px, or open this page on your phone, to see the single bottom layer.</p></div>`;
  if (id === "D3" || id === "M5") return `<div class="demo"><button class="btn sm" type="button" data-try-search>Try the search</button></div>`;
  return "";
}
function panelShell(head, body) {
  const p = $("#auditPanel");
  p.innerHTML = `<div class="ap-head">${head}<button class="iconbtn" type="button" data-close="panel" aria-label="Close audit note">${I.x}</button></div><div class="ap-body">${body}<div class="ap-links"><a class="link" href="#/audit">All 13 fixes</a><a class="link" href="${BEHANCE}" target="_blank" rel="noopener">Case study on Behance</a></div></div>`;
  p.classList.add("open"); p.setAttribute("aria-hidden", "false"); document.body.classList.add("ap-open");
  setTimeout(() => { const h = $("h2", p); if (h) h.focus({ preventScroll: true }); }, 60);
}
function openFinding(id, scroll) {
  const f = FINDINGS[id];
  if (!f) return;
  const el = target(id);
  const others = idsOnPage().filter(x => x !== id);
  panelShell(`<span class="fid">${id}</span><span class="sev ${f.sev.toLowerCase()}">${f.sev}</span>`,
    `<h2 tabindex="-1">${esc(f.title)}</h2><p class="where">${esc(f.where)}</p>
    <h3 class="was">On the live site</h3><p>${esc(f.live)}</p>${id === "D1" ? D1_BEFORE : ""}
    <h3 class="now">In this redesign</h3><p>${esc(f.now)}</p>
    ${f.why ? `<p class="why">${esc(f.why)}</p>` : ""}${demoFor(id)}
    <p class="principle">${esc(f.principle)}</p>
    ${others.length ? `<div class="ap-onpage"><span>Also on this page</span>${others.map(x => `<button class="jump" type="button" data-jump="${x}">${x}</button>`).join("")}</div>` : ""}`);
  if (el) {
    if (scroll) el.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: isMobile() ? "start" : "center" });
    flash(el);
  }
}
function openKept(k) {
  const x = KEPT[k];
  if (!x) return;
  panelShell(`<span class="fid kept">Kept</span>`, `<h2 tabindex="-1">${esc(x.title)}</h2><p class="where">A pattern from the live site that already works</p><p style="margin-top:14px">${esc(x.text)}</p><p class="principle">${esc(x.principle)}</p>`);
}
function closePanel() { const p = $("#auditPanel"); p.classList.remove("open"); p.setAttribute("aria-hidden", "true"); document.body.classList.remove("ap-open"); }

/* ---------- Router ---------- */
let currentView = null;
function parse() {
  const h = location.hash.replace(/^#/, "") || "/";
  const i = h.indexOf("?");
  return { parts: (i >= 0 ? h.slice(0, i) : h).split("/").filter(Boolean), q: new URLSearchParams(i >= 0 ? h.slice(i + 1) : "") };
}
function route() {
  if (location.hash && location.hash.indexOf("#/") !== 0) return;
  const { parts, q } = parse();
  closeCart(); closePanel();
  const sg = $("#suggest"); if (sg) sg.hidden = true;
  const hq = $("#hq"); if (hq) hq.value = "";
  let v;
  switch (parts[0]) {
    case undefined: v = Home(); break;
    case "c": v = Category(parts[1], q); break;
    case "p": v = Product(parts[1]); break;
    case "gifting": v = Gifting(); break;
    case "checkout": v = Checkout(); break;
    case "audit": v = AuditIndex(); break;
    case "shop": v = Shop(); break;
    case "search": v = Search(q); break;
    default: v = NotFound();
  }
  currentView = v;
  const main = $("#main");
  main.innerHTML = `<div id="view">${v.html}</div>`;
  document.title = v.title || "boAt, reimagined";
  document.body.classList.toggle("on-pdp", v.name === "pdp");
  const path = "#/" + parts.slice(0, 2).join("/");
  $$(".mainnav a, .tabbar a").forEach(a => {
    const href = a.getAttribute("href");
    if (href === path || (href === "#/" && path === "#/")) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
  hydrateImages(main);
  if (v.mount) v.mount();
  window.scrollTo(0, 0);
  if (q.get("audit") === "1" && !AUD.on) setAudit(true);
  decorate();
  const fix = q.get("fix");
  if (fix && FINDINGS[fix]) {
    if (!AUD.on) setAudit(true);
    setTimeout(() => openFinding(fix, true), 120);
  } else if (v.name !== "search") {
    main.focus({ preventScroll: true });
  }
}

/* ---------- Header search with live suggestions (fixes D3, M5) ---------- */
function bindHeaderSearch() {
  const form = $("#hsearch"), input = $("#hq"), box = $("#suggest");
  const show = () => {
    const v = input.value.trim();
    if (!v) { box.hidden = true; return; }
    const list = runSearch(v);
    box.innerHTML = list.length
      ? list.slice(0, 6).map(p => `<a class="sg" href="#/p/${p.id}"><span class="thumb cat-${p.cat}">${media(p)}</span><span><b>${esc(p.name)}</b><small>${esc(CATS[p.cat].single)}</small></span><span class="p">${inr(p.price)}</span></a>`).join("") + `<a class="all" href="#/search?q=${encodeURIComponent(v)}">See all ${list.length} ${list.length === 1 ? "result" : "results"}</a>`
      : `<p class="none">Nothing matches “${esc(v)}”. Try a model name, or a feature like ANC.</p>`;
    box.hidden = false;
  };
  input.addEventListener("input", show);
  input.addEventListener("focus", show);
  input.addEventListener("keydown", e => { if (e.key === "Escape") { box.hidden = true; input.blur(); } });
  form.addEventListener("submit", e => {
    e.preventDefault();
    const v = input.value.trim();
    box.hidden = true; input.blur();
    location.hash = "#/search" + (v ? "?q=" + encodeURIComponent(v) : "");
  });
  document.addEventListener("click", e => { if (!form.contains(e.target)) box.hidden = true; });
}

/* ---------- Global events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-pin],[data-kept-pin],[data-jump],[data-add],[data-open-cart],[data-close],[data-audit-toggle],[data-theme-toggle],[data-qty],[data-del],[data-break],[data-try-search],[data-demo-bulk],[data-empty]");
  if (!t) return;
  if (t.dataset.pin) { e.preventDefault(); e.stopPropagation(); openFinding(t.dataset.pin, false); return; }
  if (t.dataset.keptPin) { e.preventDefault(); e.stopPropagation(); openKept(t.dataset.keptPin); return; }
  if (t.dataset.jump) { openFinding(t.dataset.jump, true); return; }
  if (t.dataset.add) { e.preventDefault(); addToCart(t.dataset.add, 1); return; }
  if (t.hasAttribute("data-open-cart")) { e.preventDefault(); $("#toast").classList.remove("show"); closePanel(); openCart(); return; }
  if (t.dataset.close === "cart") { closeCart(); return; }
  if (t.dataset.close === "panel") { closePanel(); return; }
  if (t.hasAttribute("data-audit-toggle")) { setAudit(!AUD.on); return; }
  if (t.hasAttribute("data-theme-toggle")) { setTheme(document.documentElement.dataset.theme === "light" ? "dark" : "light"); return; }
  if (t.dataset.qty) {
    const it = cart.find(i => i.key === t.dataset.key);
    if (it) { it.qty = Math.max(1, Math.min(10, it.qty + Number(t.dataset.qty))); saveCart(); renderCart(); if (currentView && currentView.name === "checkout") route(); }
    return;
  }
  if (t.dataset.del) {
    cart = cart.filter(i => i.key !== t.dataset.del); saveCart(); renderCart();
    if (currentView && currentView.name === "checkout") route();
    const first = $("#cart [data-qty], #cart [data-close]"); if (first) first.focus();
    return;
  }
  if (t.hasAttribute("data-break")) { if (currentView && currentView.breakImage) currentView.breakImage(); return; }
  if (t.hasAttribute("data-try-search")) {
    closePanel();
    const hq = $("#hq");
    if (hq && isVis(hq)) hq.focus(); else if (currentView && currentView.name === "search") $("#sq").focus(); else location.hash = "#/search";
    return;
  }
  if (t.hasAttribute("data-demo-bulk")) { if (currentView && currentView.pid) { closePanel(); addToCart(currentView.pid, 2); openCart(); } return; }
  if (t.hasAttribute("data-empty")) { cart = []; saveCart(); renderCart(); route(); }
});
document.addEventListener("keydown", e => {
  const d = $("#cart");
  if (e.key === "Escape") {
    if (d.classList.contains("open")) closeCart();
    else if ($("#auditPanel").classList.contains("open")) closePanel();
  }
  if (e.key === "Tab" && d.classList.contains("open")) {
    const f = $$('a[href],button:not([disabled]),summary,[tabindex]:not([tabindex="-1"])', d).filter(isVis);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});
window.addEventListener("hashchange", route);

/* ---------- Theme: dark by default, remembered per browser ---------- */
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  ls.set("boatTheme", t);
  $$("[data-theme-toggle]").forEach(b => b.setAttribute("aria-label", t === "light" ? "Switch to dark mode" : "Switch to light mode"));
  const m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute("content", t === "light" ? "#FFFFFF" : "#0B0C10");
}

/* ---------- Start ---------- */
setTheme(document.documentElement.dataset.theme === "light" ? "light" : "dark");
renderFooter();
bindHeaderSearch();
const qs = new URLSearchParams(location.search);
setAudit(qs.get("audit") === "1" || ss.get("boatAudit") === "1", qs.get("audit") === "1" ? true : false);
renderCart();
updateCount();
route();
})();

</script>
</body>
</html>
